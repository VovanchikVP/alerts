# Узкий доступ для CI: ServiceAccount видит только namespace alerts.
# Применяется один раз вручную на ноде k3s, в kustomization не входит.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alerts-deployer
  namespace: alerts
---
# Долгоживущий токен: с k8s 1.24+ ServiceAccount сам секрет не создаёт.
apiVersion: v1
kind: Secret
metadata:
  name: alerts-deployer-token
  namespace: alerts
  annotations:
    kubernetes.io/service-account.name: alerts-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alerts-deployer
  namespace: alerts
rules:
  - apiGroups: [""]
    resources: [secrets, services, persistentvolumeclaims, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # pods/log и events нужны шагам rollout status, describe и логам при падении
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alerts-deployer
  namespace: alerts
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alerts-deployer
subjects:
  - kind: ServiceAccount
    name: alerts-deployer
    namespace: alerts
---
# Namespace — ресурс кластерного уровня, а манифесты создают его сами.
# Поэтому минимальные права на namespaces, и только на них.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alerts-namespace-bootstrap
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alerts-namespace-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alerts-namespace-bootstrap
subjects:
  - kind: ServiceAccount
    name: alerts-deployer
    namespace: alerts
