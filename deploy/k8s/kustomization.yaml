apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alerts

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# labels вместо устаревшего commonLabels; includeSelectors: false — чтобы не трогать
# неизменяемый selector уже работающего Deployment.
labels:
  - pairs:
      app.kubernetes.io/part-of: alerts
    includeSelectors: false

images:
  - name: alerts-bot
    newName: ghcr.io/vovanchikvp/alerts
    newTag: latest
