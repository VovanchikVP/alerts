name: CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: alerts

jobs:
  build:
    name: Сборка и публикация образа
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре
        id: meta
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить
        uses: docker/build-push-action@v6
        with:
          context: .
          # для k3s на ARM добавьте linux/arm64 — сборка пойдёт через QEMU
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатка в k3s
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Без этой проверки пустой секрет проявляется невнятно: wg-quick падает на
      # пустом конфиге, а kubectl уходит на дефолтный localhost:8080.
      - name: Проверить, что секреты заданы
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
          KUBE_API: ${{ secrets.KUBE_API }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          ALERTS_BOT_TOKEN: ${{ secrets.ALERTS_BOT_TOKEN }}
          ALERTS_INGEST_API_KEY: ${{ secrets.ALERTS_INGEST_API_KEY }}
        run: |
          missing=""
          for name in WG_CONFIG KUBE_API KUBE_CONFIG ALERTS_BOT_TOKEN ALERTS_INGEST_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты репозитория:$missing"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "все обязательные секреты на месте"

      - uses: azure/setup-kubectl@v4

      - name: Подключиться к сети WireGuard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          echo "${{ secrets.WG_CONFIG }}" | base64 -d | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show

      - name: Проверить, что API кластера виден
        env:
          KUBE_API: ${{ secrets.KUBE_API }}
        run: |
          host=$(echo "$KUBE_API" | sed -E 's#https?://##; s#/.*##')
          addr=${host%%:*}
          port=${host##*:}
          if [ "$addr" = "$port" ] || ! echo "$port" | grep -qE '^[0-9]+$'; then
            echo "::error::KUBE_API должен быть вида 10.8.0.2:6443 — сейчас порт не распознан"
            exit 1
          fi

          # первый хендшейк занимает пару секунд, поэтому не одна попытка
          ok=""
          for _ in $(seq 1 10); do
            nc -z -w3 "$addr" "$port" && { ok=1; break; }
            sleep 2
          done

          echo "--- состояние туннеля ---"
          sudo wg show
          echo "--- маршруты через туннель ---"
          ip route | grep -E "wg0|10\.8\." || echo "маршрутов через wg0 нет"

          if [ -z "$ok" ]; then
            echo "::error::$addr:$port недоступен через туннель"
            echo "Если выше в 'latest handshake' пусто — сервер не принял пир:"
            echo "  на сервере WG: sudo wg show wg0 | grep -A3 <публичный ключ раннера>"
            echo "  пир должен быть с allowed ips 10.8.0.51/32"
            echo "Если хендшейк есть, а порт не отвечает — на сервере нет forward/NAT"
            echo "для 10.8.0.51 (правила могут быть написаны только под 10.8.0.50)"
            exit 1
          fi
          echo "кластер доступен: $addr:$port"

      - name: Установить kustomize
        run: |
          version=v5.5.0
          curl -sSLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${version}/kustomize_${version}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install kustomize /usr/local/bin/kustomize

      - name: Подложить kubeconfig
        id: kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          if ! grep -q "^kind: Config" ~/.kube/config; then
            echo "::error::KUBE_CONFIG не похож на kubeconfig — проверьте, что секрет содержит вывод base64 без переносов строк"
            exit 1
          fi
          server=$(kubectl config view -o jsonpath='{.clusters[0].cluster.server}')
          echo "сервер из kubeconfig: $server"
          case "$server" in
            *127.0.0.1*|*localhost*)
              echo "::error::В kubeconfig адрес $server — он недоступен с раннера, нужен адрес в сети WG (10.8.0.2:6443)"
              exit 1
              ;;
          esac
          kubectl version --output=yaml

      - name: Namespace
        run: kubectl apply -f deploy/k8s/namespace.yaml

      - name: Секреты приложения
        run: |
          kubectl create secret generic alerts-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=ALERTS_BOT_TOKEN='${{ secrets.ALERTS_BOT_TOKEN }}' \
            --from-literal=ALERTS_INGEST_API_KEY='${{ secrets.ALERTS_INGEST_API_KEY }}' \
            --from-literal=ALERTS_OUTBOUND_TOKEN='${{ secrets.ALERTS_OUTBOUND_TOKEN }}' \
            --from-literal=ALERTS_OUTBOUND_SECRET='${{ secrets.ALERTS_OUTBOUND_SECRET }}' \
            --from-literal=ALERTS_ALLOWED_CHAT_IDS='${{ vars.ALERTS_ALLOWED_CHAT_IDS }}' \
            --from-literal=ALERTS_DEFAULT_CALLBACK_URL='${{ vars.ALERTS_DEFAULT_CALLBACK_URL }}' \
            --from-literal=ALERTS_TELEGRAM_PROXY='${{ vars.ALERTS_TELEGRAM_PROXY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Секрет для приватного образа GHCR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        if: env.GHCR_PULL_TOKEN != ''
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --namespace "$NAMESPACE" \
            --docker-server="$REGISTRY" \
            --docker-username='${{ github.actor }}' \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Подставить тег образа и хост Ingress
        working-directory: deploy/k8s
        run: |
          kustomize edit set image alerts-bot=${{ needs.build.outputs.image }}:${{ github.sha }}
          if [ -n "${{ vars.ALERTS_INGRESS_HOST }}" ]; then
            sed -i "s|alerts.example.com|${{ vars.ALERTS_INGRESS_HOST }}|g" ingress.yaml
          fi

      - name: Накатить манифесты
        run: kustomize build deploy/k8s | kubectl apply -f -

      - name: Дождаться выкатки
        run: kubectl -n "$NAMESPACE" rollout status deployment/alerts-bot --timeout=180s

      - name: Состояние после выкатки
        if: always() && steps.kubeconfig.outcome == 'success'
        run: kubectl -n "$NAMESPACE" get pods -o wide

      - name: Логи пода при сбое
        if: failure() && steps.kubeconfig.outcome == 'success'
        run: |
          kubectl -n "$NAMESPACE" describe deployment/alerts-bot || true
          kubectl -n "$NAMESPACE" logs deployment/alerts-bot --tail=100 --all-containers || true

      - name: Отключиться от WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
