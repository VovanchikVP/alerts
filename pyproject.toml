[project]
name = "alerts"
version = "0.1.0"
description = "Telegram bot: receives alerts from servers and sends back operator actions"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15",
    "aiohttp-socks>=0.10",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # длину строк контролирует форматтер
    "RUF001", # кириллица в строках и комментариях — норма для проекта
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["alerts_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["alerts_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
